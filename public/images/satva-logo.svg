<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none">
  <!-- Elegant Emblem -->
  <g transform="translate(10, 8)">
    <!-- Outer concentric sanctuary circle -->
    <circle cx="36" cy="36" r="34" stroke="#B49A67" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="36" cy="36" r="30" stroke="#B49A67" stroke-width="0.75" stroke-dasharray="2,3" stroke-opacity="0.5" />
    
    <!-- Central Sacred Leaf / Lotus Bloom -->
    <!-- Center petal -->
    <path d="M 36 12 C 40 23, 44 34, 36 54 C 28 34, 32 23, 36 12 Z" fill="#B49A67" opacity="0.95" />
    <!-- Left petal -->
    <path d="M 36 54 C 24 45, 14 36, 17 26 C 24 25, 31 38, 36 54 Z" fill="#B49A67" opacity="0.8" />
    <!-- Right petal -->
    <path d="M 36 54 C 48 45, 58 36, 55 26 C 48 25, 41 38, 36 54 Z" fill="#B49A67" opacity="0.8" />
    <!-- Base water curve / earth crescent -->
    <path d="M 19 46 C 26 56, 46 56, 53 46 C 49 59, 23 59, 19 46 Z" fill="#B49A67" opacity="0.9" />
    <!-- Center core pearl -->
    <circle cx="36" cy="36" r="2.5" fill="#F7F4EC" />
  </g>

  <!-- Typography -->
  <g transform="translate(98, 0)">
    <!-- Wordmark -->
    <text x="0" y="47" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="34" font-weight="500" letter-spacing="0.22em" fill="currentColor">
      SATVA
    </text>
    <!-- Subtitle -->
    <text x="3" y="66" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="400" letter-spacing="0.38em" fill="#B49A67">
      RESORT &amp; SANCTUARY
    </text>
  </g>
</svg>
